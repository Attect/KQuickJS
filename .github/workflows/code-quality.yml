name: Code Quality

on:
  push:
    branches: [ kotlin-implementation ]
  pull_request:
    branches: [ kotlin-implementation ]
  workflow_dispatch:
  workflow_call:

jobs:
  c-lint:
    name: C/C++ Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check C code formatting
        run: |
          find . -name '*.c' -o -name '*.h' | grep -v 'build/' | head -20 | while read file; do
            if [ -f "$file" ]; then
              clang-format --dry-run --Werror "$file" || echo "Format issue in $file"
            fi
          done
        continue-on-error: true

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --inline-suppr \
            --error-exitcode=0 \
            *.c *.h 2>&1 | head -100
        continue-on-error: true

  kotlin-lint:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: kotlin
        run: chmod +x gradlew

      - name: Run ktlint
        working-directory: kotlin
        run: ./gradlew ktlintCheck --no-daemon || true
        continue-on-error: true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c, java-kotlin

      - name: Build C code
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Setup Java for Kotlin
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Kotlin code
        working-directory: kotlin
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c"

      - name: Perform CodeQL Analysis (Kotlin)
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: kotlin
        run: chmod +x gradlew

      - name: Run tests with coverage
        working-directory: kotlin
        run: ./gradlew test --no-daemon || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: kotlin/build/reports/
