# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake Multi-Platform Build

on:
  push:
    branches: [ "cmake" ]
  pull_request:
    branches: [ "cmake" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # 使用矩阵构建支持多个平台和架构
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # x64架构
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          # ARM64架构
          - os: ubuntu-latest
            arch: arm64
          - os: macos-latest
            arch: arm64
    # 为不同架构指定runner
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-latest' || matrix.arch == 'arm64' && 'ubuntu-latest' || matrix.os }}
    # 为ARM架构设置容器
    container:
      ${{ matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64' && 'ubuntu:latest' || '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake (Ubuntu/macOS)
      if: matrix.os != 'windows-latest'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Configure CMake (Windows with MinGW)
      if: matrix.os == 'windows-latest'
      # Configure CMake in a 'build' subdirectory using MinGW generator
      run: cmake -B ${{github.workspace}}/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mquickjs-build-${{ matrix.os }}-${{ matrix.arch }}
        path:
          ${{github.workspace}}/build/mqjs*
          ${{github.workspace}}/build/mquickjs.*
          ${{github.workspace}}/build/libmquickjs.*
          ${{github.workspace}}/build/mquickjs_static.*

