name: Build Native Images

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  VERSION: "1.0.0"
  APP_NAME: "mqjs"

jobs:
  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build JAR
        working-directory: kotlin
        run: ./gradlew jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mqjs-jar
          path: kotlin/build/libs/*.jar

  build-native:
    name: Build Native (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            arch: x64
            runner: windows-latest
            ext: .exe
          - os: linux
            arch: x64
            runner: ubuntu-latest
            ext: ''
          - os: macos
            arch: x64
            runner: macos-13
            ext: ''
          - os: macos
            arch: aarch64
            runner: macos-latest
            ext: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Native Image (Windows)
        if: matrix.os == 'windows'
        working-directory: kotlin
        run: |
          ./gradlew.bat jar
          ./gradlew.bat nativeCompile

      - name: Build Native Image (Unix)
        if: matrix.os != 'windows'
        working-directory: kotlin
        run: |
          chmod +x gradlew
          ./gradlew jar
          ./gradlew nativeCompile

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp kotlin/build/native/nativeCompile/${{ env.APP_NAME }}.exe dist/${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}.exe
          else
            cp kotlin/build/native/nativeCompile/${{ env.APP_NAME }} dist/${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mqjs-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        working-directory: kotlin
        run: ./gradlew test

  release:
    name: Create Release
    needs: [build-jar, build-native, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/mqjs-jar/*.jar
            artifacts/mqjs-windows-x64/*.exe
            artifacts/mqjs-linux-x64/*
            artifacts/mqjs-macos-x64/*
            artifacts/mqjs-macos-aarch64/*
          generate_release_notes: true
