name: Kotlin CI

on:
  push:
    branches: [ kotlin-implementation ]
    paths:
      - 'kotlin/**'
      - '.github/workflows/ci-kotlin.yml'
  pull_request:
    branches: [ kotlin-implementation ]
    paths:
      - 'kotlin/**'
      - '.github/workflows/ci-kotlin.yml'
  workflow_dispatch:
  workflow_call:

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true'

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/kotlin-implementation' }}

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        working-directory: kotlin
        run: chmod +x gradlew

      - name: Build
        working-directory: kotlin
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat jar --no-daemon
          else
            ./gradlew jar --no-daemon
          fi
        shell: bash

      - name: Run tests
        working-directory: kotlin
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat test --no-daemon
          else
            ./gradlew test --no-daemon
          fi
        shell: bash

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: kotlin/build/reports/tests/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: kquickjs-jar-${{ matrix.os }}
          path: kotlin/build/libs/*.jar

  native-build:
    name: Native Image (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x64
            runner: windows-latest
            ext: .exe
          - os: linux
            arch: x64
            runner: ubuntu-latest
            ext: ''
          - os: macos
            arch: x64
            runner: macos-13
            ext: ''
          - os: macos
            arch: aarch64
            runner: macos-latest
            ext: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Native Image (Windows)
        if: matrix.os == 'windows'
        working-directory: kotlin
        run: |
          ./gradlew.bat jar --no-daemon
          ./gradlew.bat nativeCompile --no-daemon

      - name: Build Native Image (Unix)
        if: matrix.os != 'windows'
        working-directory: kotlin
        run: |
          chmod +x gradlew
          ./gradlew jar --no-daemon
          ./gradlew nativeCompile --no-daemon

      - name: Test Native Image
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            if [ -f "kotlin/build/native/nativeCompile/kquickjs.exe" ]; then
              ./kotlin/build/native/nativeCompile/kquickjs.exe -e "console.log('Hello from native image!')"
              ./kotlin/build/native/nativeCompile/kquickjs.exe -e "1 + 2"
            else
              echo "Native image not found, skipping test"
            fi
          else
            if [ -f "kotlin/build/native/nativeCompile/kquickjs" ]; then
              ./kotlin/build/native/nativeCompile/kquickjs -e "console.log('Hello from native image!')"
              ./kotlin/build/native/nativeCompile/kquickjs -e "1 + 2"
            else
              echo "Native image not found, skipping test"
            fi
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp kotlin/build/native/nativeCompile/kquickjs.exe dist/kquickjs-${{ matrix.os }}-${{ matrix.arch }}.exe
          else
            cp kotlin/build/native/nativeCompile/kquickjs dist/kquickjs-${{ matrix.os }}-${{ matrix.arch }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kquickjs-native-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: kotlin
        run: chmod +x gradlew

      - name: Check
        working-directory: kotlin
        run: ./gradlew check --no-daemon || true

      - name: Detekt
        if: always()
        working-directory: kotlin
        run: ./gradlew detekt --no-daemon || true
